<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學號 u1558043 - 圖片展示作業</title>
    <!-- 規則 2 & 5：引入外部 CSS 檔案，達成 CSS 分離 -->
    <link rel="stylesheet" href="u1558043.css">
</head>
<body>

    <header>
        <h1>圖片展示畫廊</h1>
        <p>學號：u1558043</p>
    </header>

    <!-- 規則 3：展示五張圖片 -->
    <!-- 規則 4：點擊圖片開啟新網頁 (target="_blank")，無使用 Java/JS -->
    <main class="gallery">

        <a href="https://www.google.com" target="_blank" class="image-box">
            <img src="https://picsum.photos/id/10/600/400" alt="圖片 1">
            <div class="caption">圖片 1 (點擊開啟 Google)</div>
        </a>

        <a href="https://www.wikipedia.org" target="_blank" class="image-box">
            <img src="https://picsum.photos/id/16/600/400" alt="圖片 2">
            <div class="caption">圖片 2 (點擊開啟 維基百科)</div>
        </a>

        <a href="https://www.youtube.com" target="_blank" class="image-box">
            <img src="https://picsum.photos/id/28/600/400" alt="圖片 3">
            <div class="caption">圖片 3 (點擊開啟 YouTube)</div>
        </a>

        <a href="https://github.com" target="_blank" class="image-box">
            <img src="https://picsum.photos/id/54/600/400" alt="圖片 4">
            <div class="caption">圖片 4 (點擊開啟 GitHub)</div>
        </a>

        <a href="https://unsplash.com" target="_blank" class="image-box">
            <img src="https://picsum.photos/id/60/600/400" alt="圖片 5">
            <div class="caption">圖片 5 (點擊開啟 Unsplash)</div>
        </a>

    </main>

    <footer>
        <p>學號：u1558043 | 純 HTML + CSS 作業展示</p>
    </footer>

</body>
</html>
